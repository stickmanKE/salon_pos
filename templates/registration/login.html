<!DOCTYPE html>
<html>
<head>
  <title>Point of Sale</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>

<body class="flex items-center justify-center h-screen overflow-hidden bg-gradient-to-br from-rose-50 to-pink-100">

  <!-- Pattern Background -->
  <svg class="absolute inset-0 w-full h-full pointer-events-none opacity-30">
    <defs>
      <pattern id="hair-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
        <circle cx="10" cy="10" r="2" fill="#a0c6ff"/>
        <circle cx="30" cy="30" r="2" fill="#5e89ff"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#hair-pattern)" />
  </svg>

  <!-- Glass Card -->
  <div class="backdrop-blur-lg bg-white/80 p-8 rounded-3xl shadow-2xl w-96 border border-white/40 relative z-10 transition duration-300 hover:shadow-pink-200">

    <!-- Logo / Title -->
    <h2 class="text-2xl font-semibold text-center text-gray-800 mb-1">
      Beauty Salon Point Of Sale
    </h2>

    <p class="text-center text-sm text-gray-500 mb-6">
      Welcome back, stylist 
    </p>

    <form method="POST">
      {% csrf_token %}

      {% if form.errors %}
        <div class="mb-4 p-3 text-sm text-red-600 bg-red-50 rounded-lg border border-red-200">
          ⚠️ Invalid username or password
        </div>
      {% endif %}

      <!-- Username -->
      <div class="mb-5">
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Username
        </label>
        <input
          type="text"
          name="username"
          placeholder="Enter username"
          class="w-full p-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-400 transition"
        >
      </div>

      <!-- Password -->
      <div class="mb-6 relative">
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Password
        </label>

        <input
          type="password"
          name="password"
          id="password"
          placeholder="Enter password"
          class="w-full p-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-400 transition"
        >

        <!-- Toggle Password -->
        <span onclick="togglePassword()" 
              class="absolute right-3 top-10 text-gray-400 cursor-pointer text-sm">
          👁
        </span>
      </div>

      <!-- Button -->
      <button
        type="submit"
        class="w-full bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-medium p-3 rounded-lg shadow-md transition transform hover:scale-[1.02]"
      >
        Login
      </button>

    </form>

    <!-- Footer -->
    <p class="text-center text-xs text-gray-400 mt-6">
      Salon POS System • Secure Login
    </p>

  </div>

  <!-- Script -->
  <script>
    function togglePassword() {
      const input = document.getElementById("password");
      input.type = input.type === "password" ? "text" : "password";
    }
  </script>

</body>
</html>
